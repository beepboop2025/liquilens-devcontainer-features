name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate metadata, scripts, and action pins
        run: bash scripts/validate-static.sh

      - name: Package with the pinned Dev Container CLI
        run: |
          npx --yes @devcontainers/cli@0.88.0 features package src \
            --output-folder /tmp/liquilens-feature-package \
            --force-clean-output-folder
          test -f /tmp/liquilens-feature-package/devcontainer-feature-liquilens-evidence.tgz
          tar -tzf /tmp/liquilens-feature-package/devcontainer-feature-liquilens-evidence.tgz |
            grep -Fx './devcontainer-feature.json'

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate Feature schema
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772
        with:
          validate-only: "true"
          base-path-to-features: "./src"
          devcontainer-cli-version: "0.88.0"

  test-root:
    name: feature (root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Install and test as root
        run: |
          devcontainer features test \
            --skip-scenarios \
            --skip-duplicated \
            --features liquilens-evidence \
            --base-image debian:bookworm-slim \
            .

  test-non-root:
    name: feature (non-root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0

      - name: Install and test as vscode
        run: |
          devcontainer features test \
            --features liquilens-evidence \
            --skip-autogenerated \
            --skip-duplicated \
            .
